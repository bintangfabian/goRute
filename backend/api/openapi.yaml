openapi: 3.1.0
info:
  title: goRute API
  version: 0.1.0
  description: |
    API backend goRute. File ini adalah kontrak antara backend Go dan web app.
    Setelah mengubahnya, jalankan `make gen-api` untuk memperbarui tipe TypeScript.
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness check
      responses:
        "200":
          description: API hidup
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
  /api/v1/status:
    get:
      operationId: getStatus
      summary: Status API dan OpenTripPlanner
      responses:
        "200":
          description: Status layanan. Selalu 200 agar web app bisa menampilkan mode terbatas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
  /api/v1/plan:
    get:
      operationId: getPlan
      summary: Cari opsi perjalanan antara dua titik
      parameters:
        - { name: fromLat, in: query, required: true, schema: { type: number } }
        - { name: fromLon, in: query, required: true, schema: { type: number } }
        - { name: fromName, in: query, schema: { type: string } }
        - { name: toLat, in: query, required: true, schema: { type: number } }
        - { name: toLon, in: query, required: true, schema: { type: number } }
        - { name: toName, in: query, schema: { type: string } }
        - name: time
          in: query
          description: Waktu berangkat (RFC 3339). Default sekarang.
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Opsi perjalanan. Daftar kosong berarti tidak ada rute.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        "400":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
  /api/v1/places:
    get:
      operationId: searchPlaces
      summary: Cari tempat di Jabodetabek
      parameters:
        - name: q
          in: query
          required: true
          description: Kata kunci, minimal 2 karakter.
          schema: { type: string }
      responses:
        "200":
          description: Tempat yang cocok, paling relevan dulu.
          content:
            application/json:
              schema:
                type: object
                required: [places]
                properties:
                  places:
                    type: array
                    items:
                      $ref: "#/components/schemas/PlaceResult"
        "502":
          $ref: "#/components/responses/Error"
components:
  responses:
    Error:
      description: Pesan galat yang bisa langsung ditampilkan ke pengguna.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: string
  schemas:
    Status:
      type: object
      required: [api, otp]
      properties:
        api:
          type: string
          const: ok
        otp:
          type: object
          required: [reachable, feeds]
          properties:
            reachable:
              type: boolean
              description: Apakah OpenTripPlanner bisa dihubungi.
            feeds:
              type: array
              description: ID feed GTFS yang dimuat OTP (misal TJ, KRL).
              items:
                type: string
    Plan:
      type: object
      required: [itineraries, ranking]
      properties:
        itineraries:
          type: array
          items:
            $ref: "#/components/schemas/Itinerary"
        ranking:
          type: object
          description: ID itinerary dari terbaik ke terburuk untuk tiap preferensi.
          required: [tercepat, termurah, termudah]
          properties:
            tercepat: { type: array, items: { type: string } }
            termurah: { type: array, items: { type: string } }
            termudah: { type: array, items: { type: string } }
    Itinerary:
      type: object
      required: [id, start, end, durationSec, walkDistanceM, transfers, fare, legs]
      properties:
        id: { type: string }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        durationSec: { type: integer }
        walkDistanceM: { type: integer }
        transfers: { type: integer }
        fare:
          type: object
          required: [totalIdr, complete]
          properties:
            totalIdr: { type: integer }
            complete:
              type: boolean
              description: false jika ada moda tanpa data tarif, sehingga totalIdr adalah batas bawah.
        legs:
          type: array
          items:
            $ref: "#/components/schemas/Leg"
    Leg:
      type: object
      required: [mode, start, end, durationSec, distanceM, from, to, route, fareIdr, geometry]
      properties:
        mode:
          type: string
          description: Moda OTP, misal WALK, BUS, RAIL, SUBWAY, TRAM.
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        durationSec: { type: integer }
        distanceM: { type: integer }
        from:
          $ref: "#/components/schemas/Place"
        to:
          $ref: "#/components/schemas/Place"
        route:
          oneOf:
            - $ref: "#/components/schemas/Route"
            - type: "null"
        fareIdr:
          type: [integer, "null"]
          description: Dibayar saat naik leg ini. 0 jika tercakup tiket sebelumnya, null untuk jalan kaki atau tarif tidak diketahui.
        geometry:
          type: array
          description: Jalur leg sebagai pasangan [lon, lat].
          items:
            type: array
            items: { type: number }
            minItems: 2
            maxItems: 2
    Place:
      type: object
      required: [name, lat, lon]
      properties:
        name: { type: string }
        lat: { type: number }
        lon: { type: number }
    PlaceResult:
      type: object
      required: [id, name, address, lat, lon]
      properties:
        id: { type: string }
        name: { type: string }
        address: { type: string }
        lat: { type: number }
        lon: { type: number }
    Route:
      type: object
      required: [id, shortName, longName, category, color, textColor, agency]
      properties:
        id: { type: string }
        shortName: { type: string }
        longName: { type: string }
        category:
          type: string
          description: Kategori layanan dari GTFS, misal BRT, Mikrotrans, Royaltrans.
        color:
          type: string
          description: Warna hex dengan '#', bisa kosong.
        textColor: { type: string }
        agency: { type: string }
