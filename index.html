<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Cari rute transportasi umum tercepat, termurah, dan termudah di Jabodetabek." />
    <meta name="application-name" content="goRute" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="goRute" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="goRute" />
    <meta property="og:title" content="goRute · Rute transportasi umum Jabodetabek" />
    <meta property="og:description" content="Cari rute tercepat, termurah, dan termudah naik TransJakarta." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="id_ID" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>goRute · Rute transportasi umum Jabodetabek</title>
    <style>
      /*
       * Splash: shown before the app's JavaScript loads, removed by src/main.tsx.
       * When that never runs (no network on the first visit, a browser too old
       * for the app), it steps aside after 10 s for the note in #root.
       */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: grid;
        place-items: center;
        background: #0f766e;
        transition:
          opacity 0.4s ease,
          visibility 0.4s;
        animation: splash-give-up 0.4s ease 10s forwards;
      }
      #splash.done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #splash .inner {
        display: grid;
        justify-items: center;
        gap: 14px;
        transition: transform 0.4s ease;
      }
      #splash.done .inner {
        transform: scale(1.06);
      }
      #splash svg {
        width: 104px;
        height: 104px;
        overflow: visible;
      }
      #splash .route {
        fill: none;
        stroke: #fff;
        stroke-width: 36;
        stroke-dasharray: var(--len);
        stroke-dashoffset: var(--len);
        animation: splash-draw 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
      #splash .bowl {
        --len: 315;
      }
      #splash .tail {
        --len: 211;
        animation-delay: 0.3s;
      }
      #splash .cap,
      #splash .stop {
        transform: scale(0);
        transform-box: fill-box;
        transform-origin: center;
        animation: splash-pop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }
      #splash .cap {
        animation-duration: 0.2s;
        animation-delay: 0.3s;
      }
      #splash .stop {
        animation-delay: 0.8s;
      }
      #splash .word {
        color: #fff;
        font: 800 28px/1 'Plus Jakarta Sans Variable', ui-sans-serif, system-ui, sans-serif;
        letter-spacing: -0.02em;
        opacity: 0;
        transform: translateY(8px);
        animation: splash-rise 0.5s ease 0.9s forwards;
      }
      #splash .word b {
        color: #99f6e4;
        font-weight: inherit;
      }
      @keyframes splash-draw {
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes splash-pop {
        to {
          transform: scale(1);
        }
      }
      @keyframes splash-rise {
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes splash-give-up {
        to {
          opacity: 0;
          visibility: hidden;
        }
      }
      /* The note in #root, which the app replaces as soon as it draws. */
      .boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 10px;
        padding: 24px;
        background: #0f766e;
        color: #ccfbf1;
        font: 15px/1.5 'Plus Jakarta Sans Variable', ui-sans-serif, system-ui, sans-serif;
        text-align: center;
        visibility: hidden;
        opacity: 0;
        animation: boot-show 0.4s ease 10s forwards;
      }
      .boot svg {
        width: 72px;
        height: 72px;
        margin-bottom: 6px;
      }
      .boot p {
        max-width: 320px;
        margin: 0;
      }
      .boot .title {
        color: #fff;
        font-size: 20px;
        font-weight: 800;
      }
      .boot a {
        margin-top: 10px;
        padding: 10px 22px;
        border-radius: 999px;
        background: #fff;
        color: #0f766e;
        font-weight: 700;
        text-decoration: none;
      }
      .boot a:focus-visible {
        outline: 3px solid #fbbf24;
        outline-offset: 3px;
      }
      @keyframes boot-show {
        to {
          visibility: visible;
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        /* Still fade the splash out when it gives up: only the logo stops moving. */
        #splash * {
          animation: none !important;
        }
        #splash,
        #splash * {
          transition: none !important;
        }
        #splash .route {
          stroke-dashoffset: 0;
        }
        #splash .cap,
        #splash .stop,
        #splash .word {
          transform: none;
          opacity: 1;
        }
      }
    </style>
    <noscript>
      <style>
        /* Without JavaScript there is nothing to wait for. */
        #splash,
        .boot .net {
          display: none;
        }
        .boot {
          visibility: visible;
          opacity: 1;
          animation: none;
        }
      </style>
    </noscript>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="inner">
        <!-- The logo drawn as the route it stands for: the bowl, the tail, then the amber stop. -->
        <svg viewBox="0 0 256 256">
          <circle class="route bowl" cx="129" cy="88" r="50" />
          <path class="route tail" d="M179 38V152A50 50 0 0 1 129 202H111" />
          <circle class="cap" cx="179" cy="38" r="18" fill="#fff" />
          <circle class="stop" cx="89" cy="202" r="20.5" fill="none" stroke="#fbbf24" stroke-width="19" />
        </svg>
        <div class="word"><b>go</b>Rute</div>
      </div>
    </div>
    <div id="root">
      <div class="boot">
        <svg viewBox="0 0 256 256" aria-hidden="true">
          <path
            fill="#fff"
            d="M61 88A68 68 0 1 1 197 88A68 68 0 1 1 61 88Z M97 88A32 32 0 1 0 161 88A32 32 0 1 0 97 88Z M161 38A18 18 0 0 1 197 38V152A68 68 0 0 1 129 220H111V184H129A32 32 0 0 0 161 152Z"
          />
          <path fill="#fbbf24" d="M59 202A30 30 0 1 1 119 202A30 30 0 1 1 59 202Z M78 202A11 11 0 1 0 100 202A11 11 0 1 0 78 202Z" />
        </svg>
        <p class="title">goRute belum terbuka</p>
        <p class="net">
          Koneksi mungkin lambat atau terputus. Tunggu sebentar atau muat ulang. Kalau tetap begini, perbarui browser atau
          coba browser lain.
        </p>
        <noscript><p>goRute butuh JavaScript. Aktifkan JavaScript di browser ini, lalu muat ulang.</p></noscript>
        <a href="">Muat ulang</a>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
